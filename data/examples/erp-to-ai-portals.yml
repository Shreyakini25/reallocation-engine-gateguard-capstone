# Example portals config for the ERP-to-AI Engineering mode (tracked sample).
#
#   REALLOCATION_ENGINE_PORTALS=data/examples/erp-to-ai-portals.yml \
#     npm run ats:scan -- --dry-run
#
# Enabled companies are drawn from the applied-AI H-1B shortlist (filter script)
# and verified to expose a Greenhouse JSON API. Scanner support: greenhouse ·
# lever · ashby only. Amazon/Apple/Google/Infosys/TCS use Workday/proprietary
# portals — listed with enabled: false until a provider exists.

title_filter:
  positive:
    - "Machine Learning"
    - "ML Engineer"
    - "Data Engineer"
    - "Data Scientist"
    - "Software Engineer"
    - "Applied"
    - "AI"
  negative:
    - "Intern"
    - "Volunteer"
    - "Research Scientist"
    - "PhD"

location_filter:
  always_allow:
    - "United States"
    - "USA"
  allow:
    - "United States"
    - "USA"
    - "Remote"

tracked_companies:
  # ── Applied-AI H-1B shortlist + Greenhouse (scannable) ────────────

  - name: LinkedIn
    enabled: true
    provider: greenhouse
    careers_url: https://job-boards.greenhouse.io/linkedin
